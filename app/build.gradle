plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.pkgbridge.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.pkgbridge.app'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty('buildNumber') ?: '1').toString())
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'commons-net:commons-net:3.13.0'
}
